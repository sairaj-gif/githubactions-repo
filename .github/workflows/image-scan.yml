name: image-scan

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  image-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/action-docker:latest
          severity: CRITICAL
          exit-code: '1'